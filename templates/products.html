{% extends 'base.html' %}
{% set active_page = "api_products" %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Product Catalog</h1>
      <p class="text-slate-500 mt-1 text-sm">Live from <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700 font-mono text-xs">vectors/*.pkl</code> — the reference embeddings the matcher identifies scans against</p>
    </div>
    <div class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-xl shadow-sm">
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      <span class="text-sm font-mono font-medium text-slate-600" id="catalog-meta">Loading catalog...</span>
    </div>
  </div>

  <div>
    <a href="{{ url_for('add_scan_page') }}" class="inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white px-5 py-2.5 rounded-xl font-medium transition-all shadow-lg shadow-primary-500/20">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      Add New Scan
    </a>
  </div>

  <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
  <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-200">
    <div class="text-4xl mb-3">📦</div>
    <p class="text-slate-500 font-medium">No products found in the catalog.</p>
  </div>
</div>

<script>
  async function loadProducts() {
    let data;
    try { const res = await fetch('/api/products'); data = await res.json(); } catch (err) { document.getElementById('catalog-meta').textContent = 'Failed to load'; return; }
    document.getElementById('catalog-meta').textContent = `${data.count} product${data.count === 1 ? '' : 's'} in catalog`;
    const grid = document.getElementById('product-grid');
    const emptyState = document.getElementById('empty-state');
    if (!data.products || data.products.length === 0) { emptyState.classList.remove('hidden'); return; }
    emptyState.classList.add('hidden');
    grid.innerHTML = data.products.map(p => `
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden group">
        <!-- Image Section -->
        <div class="relative aspect-square bg-slate-50 overflow-hidden">
          ${p.image_url 
            ? `<img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${p.image_url}" alt="Product ${p.id}">` 
            : `<div class="w-full h-full flex items-center justify-center text-slate-400 text-sm">No image</div>`
          }
          
          <!-- Product ID Badge -->
          <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-lg shadow-sm">
            <span class="text-xs font-bold text-slate-900 font-mono">#${p.id}</span>
          </div>

          <!-- Delete Button -->
          <button onclick="deleteProduct('${p.id}')" class="absolute top-3 right-3 w-8 h-8 bg-white/90 backdrop-blur-sm rounded-lg flex items-center justify-center text-red-600 hover:bg-red-600 hover:text-white transition-all duration-200 opacity-0 group-hover:opacity-100 shadow-sm" title="Delete product">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>

        <!-- Content Section -->
        <div class="p-4 space-y-4">
          <!-- Stats Row -->
          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              <span class="text-slate-600 font-medium">${p.reference_samples} samples</span>
            </div>
            <div class="text-slate-400 font-mono">${p.embedding_dim}d</div>
          </div>

          <!-- Display Name Input -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Display Name</label>
            <input class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500/10 outline-none transition-all" 
                   data-id="${p.id}" 
                   data-field="name" 
                   value="${p.name && p.name !== p.id ? p.name : ''}" 
                   placeholder="e.g. Whole Milk 1L">
          </div>

          <!-- Price Row -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Price</label>
            <div class="flex gap-2">
              <div class="flex-1 relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">$</span>
                <input class="w-full pl-7 pr-3 py-2 rounded-lg border border-slate-200 text-sm font-mono focus:border-primary-500 focus:ring-2 focus:ring-primary-500/10 outline-none transition-all" 
                       data-id="${p.id}" 
                       data-field="price" 
                       type="number" 
                       min="0" 
                       step="0.01" 
                       value="${p.price || ''}" 
                       placeholder="0.00">
              </div>
              <button class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold transition-colors shadow-sm" 
                      data-id="${p.id}" 
                      type="button">
                Save
              </button>
            </div>
          </div>

          <!-- Status Message -->
          <div class="text-xs min-h-[16px]" id="meta-status-${p.id}"></div>
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('[data-id][type="button"]').forEach(btn => {
      btn.addEventListener('click', () => saveProductMeta(btn.dataset.id));
    });
  }

  async function saveProductMeta(productId) {
    const nameInput = document.querySelector(`input[data-id="${productId}"][data-field="name"]`);
    const priceInput = document.querySelector(`input[data-id="${productId}"][data-field="price"]`);
    const statusEl = document.getElementById(`meta-status-${productId}`);
    const body = {};
    if (nameInput.value.trim()) body.name = nameInput.value.trim();
    if (priceInput.value !== '') body.price = priceInput.value;
    statusEl.textContent = 'Saving...';
    statusEl.className = 'text-xs text-slate-500';
    try {
      const res = await fetch(`/api/products/${productId}/meta`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok || data.error) { statusEl.textContent = data.error || 'Failed to save.'; statusEl.className = 'text-xs text-red-600'; return; }
      statusEl.textContent = '✓ Saved';
      statusEl.className = 'text-xs text-emerald-600 font-medium';
      setTimeout(() => { statusEl.textContent = ''; }, 2000);
    } catch (err) { statusEl.textContent = 'Network error.'; statusEl.className = 'text-xs text-red-600'; }
  }

  async function deleteProduct(productId) {
    if (!confirm(`Are you sure you want to delete Product #${productId}? This will remove all reference images and vectors. This action cannot be undone.`)) {
      return;
    }

    try {
      const res = await fetch(`/api/products/${productId}/delete`, { method: 'POST' });
      const data = await res.json();
      
      if (data.success) {
        const card = document.querySelector(`button[onclick="deleteProduct('${productId}')"]`).closest('.bg-white');
        card.style.transition = 'all 0.3s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.9)';
        setTimeout(() => {
          card.remove();
          loadProducts();
        }, 300);
      } else {
        alert('Error deleting product: ' + (data.error || 'Unknown error'));
      }
    } catch (err) {
      alert('Network error while deleting product');
    }
  }

  loadProducts();
</script>
{% endblock %}
