<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ScanDesk OS - Checkout Monitoring{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-focus: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      --primary: #2563eb;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Styling */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .nav-link:hover {
      color: var(--text-main);
      background: var(--bg-main);
    }

    .nav-link.active {
      color: var(--primary);
      background: var(--primary-light);
    }

    .system-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--success-bg);
      border: 1px solid rgba(22, 163, 74, 0.2);
      border-radius: 999px;
      color: var(--success);
      font-weight: 600;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    /* Grid & Cards */
    .dashboard-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 24px;
    }

    @media (max-width: 1200px) {
      .dashboard-container { grid-template-columns: 1fr; }
    }

    .main-content, .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    @media (max-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
    .kpi-value { font-size: 24px; font-weight: 700; font-family: var(--font-mono); letter-spacing: -0.02em; margin-bottom: 4px; }
    .kpi-trend { font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); }

    /* Camera Feed */
    .camera-card { position: relative; overflow: hidden; }
    .camera-viewport {
      position: relative;
      width: 100%;
      height: 440px;
      background: #0f172a;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-stream {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .desk-surface {
      width: 80%;
      height: 75%;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      position: relative;
    }

    .camera-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .hud-chip {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-primary:hover { background: #1d4ed8; }

    /* Scan List */
    .scan-list { display: flex; flex-direction: column; gap: 10px; }
    .scan-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .item-info { display: flex; align-items: center; gap: 12px; }
    .item-thumb { width: 40px; height: 40px; background: var(--bg-main); border-radius: var(--radius-sm); display: grid; place-items: center; font-size: 18px; }
    .item-name { font-weight: 600; font-size: 13px; }
    .item-meta { font-size: 11px; color: var(--text-muted); }
    .item-score { text-align: right; }
    .score-value { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
    .score-high { color: var(--success); }
    .score-med { color: var(--warning); }
    .score-low { color: var(--danger); }

    /* Gauges and Tables */
    .gauge-container { display: flex; flex-direction: column; align-items: center; padding: 16px 0; }
    .accuracy-progress-bar { width: 100%; height: 8px; background: var(--bg-main); border-radius: 999px; overflow: hidden; margin: 12px 0 6px 0; }
    .accuracy-progress-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width 0.4s ease; }

    .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    .data-table th { padding: 8px 12px; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .data-table tr:last-child td { border-bottom: none; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; font-family: var(--font-mono); }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-neutral { background: var(--bg-main); color: var(--text-muted); }

    /* AI Forecast */
    .forecast-highlight {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--primary-light), var(--surface));
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }
    .forecast-highlight-icon {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--primary); color: white; display: grid; place-items: center; font-size: 16px; flex-shrink: 0;
    }
    .forecast-highlight-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .forecast-highlight-value { font-size: 15px; font-weight: 700; }
    .forecast-note { font-size: 11px; color: var(--text-subtle); margin-top: 10px; }

    .alert-list { display: flex; flex-direction: column; gap: 8px; }
    .alert-item { display: flex; gap: 8px; align-items: flex-start; padding: 10px; border-radius: var(--radius-sm); font-size: 12px; border: 1px solid var(--border); }
    .alert-item.alert-warning { background: var(--warning-bg); border-color: rgba(217, 119, 6, 0.25); }
    .alert-item.alert-danger { background: var(--danger-bg); border-color: rgba(220, 38, 38, 0.25); }
    .alert-item.alert-success { background: var(--success-bg); border-color: rgba(22, 163, 74, 0.25); }
    .alert-icon { flex-shrink: 0; }

    /* Trend charts */
    .mini-chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .mini-chart-grid { grid-template-columns: 1fr; }
    }
    .chart-card-value {
      font-size: 20px;
      font-weight: 700;
      font-family: var(--font-mono);
      margin-bottom: 2px;
    }
    .chart-card-caption {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .chart-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 24px 0;
    }
    .hbar-row { margin-bottom: 10px; }
    .hbar-row:last-child { margin-bottom: 0; }
    .hbar-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .hbar-label-row span:first-child { color: var(--text-main); font-weight: 500; }
    .hbar-label-row span:last-child { color: var(--text-muted); font-family: var(--font-mono); font-weight: 600; }
    .hbar-track {
      background: var(--bg-main);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .hbar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--success);
      transition: width 0.4s ease;
    }
  </style>

  {% block styles %}{% endblock %}
</head>

<body>

  {% include 'components/header.html' %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
